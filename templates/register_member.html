<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация специалиста — Tech Idea Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #F3F4F6; display: flex; height: 100vh; }
        
        .split-left { flex: 1; background: linear-gradient(135deg, #059669 0%, #10B981 100%); display: flex; flex-direction: column; justify-content: center; padding: 4rem; color: white; }
        .split-left h1 { font-size: 2.8rem; font-weight: 700; line-height: 1.2; margin-bottom: 1.5rem; }
        .split-left p { font-size: 1.2rem; opacity: 0.9; }

        .split-right { flex: 1; padding: 3rem 2rem; display: flex; justify-content: center; overflow-y: auto; }
        .form-card { background: white; padding: 3rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 500px; height: fit-content; }
        .form-card h2 { font-size: 1.8rem; color: #111827; margin-bottom: 0.5rem; }
        .form-card p.subtitle { color: #6B7280; margin-bottom: 2rem; font-size: 0.95rem; }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 500; color: #374151; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 0.85rem 1rem; border: 1.5px solid #E5E7EB; border-radius: 8px; font-size: 1rem; transition: all 0.2s ease; outline: none; background: #FAFAFA; }
        .form-control:focus { border-color: #10B981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); background: white; }
        textarea.form-control { resize: vertical; min-height: 100px; }
        
        .btn-submit { width: 100%; padding: 1rem; background: #10B981; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: #059669; transform: translateY(-1px); }
        
        .bottom-links { margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: #6B7280; }
        .bottom-links a { color: #10B981; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="split-left">
        <h1>Помогите идее вырасти</h1>
        <p>Присоединяйтесь к проектам в качестве наставника, специалиста или консультанта. Делитесь опытом и развивайтесь вместе с командами.</p>
    </div>

    <div class="split-right">
        <div class="form-card">
            <h2>Создание профиля эксперта</h2>
            <p class="subtitle">Расскажите о себе и своей экспертизе.</p>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="form-group">
                    <label>Фотография профиля</label>
                    <input type="file" name="photo" accept="image/*" class="form-control" style="padding: 0.5rem;">
                </div>

                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" name="username" class="form-control" placeholder="Придумайте логин" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" class="form-control" placeholder="Придумайте пароль" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <label>Кто вы?</label>
                    <select name="role" class="form-control">
                        <option value="mentor">Я наставник</option>
                        <option value="specialist">Я специалист</option>
                        <option value="consultant">Я консультант</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>О себе, образование, компетенции</label>
                    <textarea name="about" class="form-control" placeholder="Опишите ваш опыт, в чем вы можете помочь проекту, какое у вас образование..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Создать профиль</button>
            </form>

            <div class="bottom-links">
                Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
                <br><br>
                <a href="{% url 'home' %}" style="color: #9CA3AF; font-weight: 500;">← На главную</a>
            </div>
        </div>
    </div>
</body>
</html>
