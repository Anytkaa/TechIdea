{% extends 'base.html' %}
{% load static %}

{% block title %}Рабочая доска{% endblock %}

{% block content %}
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <div>
            <h1 style="font-size: 1.8rem; color: var(--text-main);">Рабочая доска</h1>
            <p style="color: var(--text-muted);">Рисуйте, добавляйте текст, стикеры и картинки вместе с командой.</p>
        </div>
    </div>

    <!-- Контейнер для iframe -->
    <div style="width: 100%; height: calc(100vh - 200px); min-height: 500px; border-radius: 12px; overflow: hidden; border: 1px solid #E5E7EB; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <iframe 
            id="boardFrame"
            src="http://localhost:5174/?projects={{ user_projects_json|urlencode }}&current={{ project.id }}" 
            style="width: 100%; height: 100%; border: none;">
        </iframe>
    </div>
{% endblock %}
